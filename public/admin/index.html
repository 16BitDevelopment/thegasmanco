<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="robots" content="noindex">

        <title>Admin Login</title>

        <link rel="icon" type="image/x-icon" href="/images/favicon.png">

        <link rel="stylesheet" href="/styles/general.css">
        <link rel="stylesheet" href="/styles/admin.css">
    </head>
    <body>
        <div class="login-form-container" id="login-form-container">
            <form class="login-form" id="login-form">
                <p class="error" id="error-msg"></p>
                <h2>Login</h2>
                <div class="login-form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Email...">
                </div>
                <div class="login-form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Password...">
                </div>
                <button type="submit">Login</button>
            </form>
        </div>

        <div class="order-preview-container" id="order-preview"></div>

        <div class="admin-container" id="admin-container">
            <div class="navbar">
                <button id="show-orders-btn">Orders</button>
                <button id="show-clients-btn">Clients</button>
                <p id="navbar-email"></p>
                <button class="log-out-btn" onclick="logOut()">Log Out</button>
            </div>
            <div class="orders show" id="orders">
                <div class="orders-menu">
                    <div class="order-status">
                        <input type="radio" id="status-incomplete" name="order-status" checked>
                        <label for="status-incomplete" id="status-incomplete">Incomplete</label>
                        <input type="radio" id="status-complete" name="order-status">
                        <label for="status-complete" id="status-complete">Complete</label>
                    </div>
                </div>
                <div class="heading">
                    <p>Order #</p>
                    <p>Request Time (Ago)</p>
                    <p>Name</p>
                    <p>Location</p>
                    <p>Payment</p>
                </div>
            </div>
            <div class="clients" id="clients">
                <div class="heading">
                    <p>Client #</p>
                    <p>Name</p>
                    <p>Email</p>
                    <p>Phone</p>
                </div>
            </div>
        </div>

        <script type="module" src="/admin/admin.js"></script>
    </body>
</html>
